<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="svv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0A192F" stroke="url(#svv-grad)" stroke-width="3" filter="url(#shadow)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Medical Cross Shape with Rounded Pills -->
  <rect x="52" y="26" width="24" height="76" rx="12" fill="url(#svv-grad)" />
  <rect x="26" y="52" width="76" height="24" rx="12" fill="url(#svv-grad)" />
  
  <!-- Center Core Heartbeat / ECG Wave -->
  <path d="M 36 64 L 50 64 L 56 46 L 64 82 L 72 50 L 78 64 L 92 64" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Subtle Top-Right Sparkle -->
  <circle cx="94" cy="34" r="4" fill="#38BDF8" />
  <circle cx="34" cy="94" r="3" fill="#34D399" />
</svg>
